name: Build BunnyPet (Windows)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish compact framework-dependent app
        run: dotnet publish BunnyPet/BunnyPet.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunnyPet-Windows
          path: publish/BunnyPet.exe
          if-no-files-found: error
